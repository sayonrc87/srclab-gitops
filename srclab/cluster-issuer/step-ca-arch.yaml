apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-arch
spec:
  acme:
    server: https://arch.srclab.internal:8443/acme/acme/directory
    email: sayon87@gmail.com  
    privateKeySecretRef:
      name: step-ca-acme-account-key
    caBundle: 
    solvers:
    - dns01:
        rfc2136:
          nameserver: 192.168.122.1:53
          tsigKeyName: cert-manager-key
          tsigAlgorithm: HMACSHA256
          tsigSecretSecretRef:
            name: bind-tsig-secret
            key: tsig-secret
      selector:
        dnsZones:
        - srclab.internal
    