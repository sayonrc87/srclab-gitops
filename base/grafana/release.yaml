apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 5m
  chart:
    spec:
      # https://github.com/grafana-community/helm-charts/tree/main/charts/grafana
      chart: grafana
      version: 12.1.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 10m
  values:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::626635402027:role/vozzo-prod-aps1/vozzo-prod-aps1-grafana-sa
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        searchNamespace: ALL
        provider:
          allowUiUpdates: false
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL
        provider:
          allowUiUpdates: false
          foldersFromFilesStructure: true