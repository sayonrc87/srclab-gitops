apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 30m
  chart:
    spec:
      # https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-blackbox-exporter
      chart: prometheus-blackbox-exporter
      version: "11.9.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: monitoring
  values:
    config:
      modules:
        http_2xx:
          http:
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
          prober: http
          timeout: 5s
        https_2xx:
          http:
            fail_if_not_ssl: true
            fail_if_ssl: false
            method: GET
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
            valid_status_codes:
            - 200
          prober: http
          timeout: 5s
        https_4xx:
          http:
            fail_if_not_ssl: true
            fail_if_ssl: false
            method: GET
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
            valid_status_codes:
            - 404
            - 401
          prober: http
          timeout: 5s
        tcp_tls:
          prober: tcp
          timeout: 5s
          tcp:
            tls: true
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
        additionalMetricsRelabels: {}
        additionalRelabeling: []
        labels:
          release: prometheus
        path: /metrics
        interval: 120s
        scrapeTimeout: 30s
    nodeSelector:
      workload-type: opz
    tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "opz"
      effect: "PreferNoSchedule"