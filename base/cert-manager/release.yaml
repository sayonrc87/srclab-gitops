apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      # https://artifacthub.io/packages/helm/cert-manager/cert-manager
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
  values:
    installCRDs: true
    serviceAccount:
      create: true
      name: cert-manager